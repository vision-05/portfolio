name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed for the official GitHub Pages deploy actions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The ClojureScript project lives in the portfolio/ subdirectory
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Maven (.m2) deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('portfolio/shadow-cljs.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install npm dependencies
        run: npm install

      - name: Build release
        run: npx shadow-cljs release app

      - name: Add CNAME for custom domain
        # Tells GitHub Pages to serve the site at (and redirect to) timfrankel.com
        run: echo 'timfrankel.com' > resources/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Directory that contains index.html and the compiled JS
          path: portfolio/resources/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
