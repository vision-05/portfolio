services:
  deploy:
    build:
      context: ./portfolio
      target: prod
    ports:
      - "8080:8080"

  watch:
    build:
      context: ./portfolio
      target: dev
    ports:
      - "8280:8280"
      - "9630:9630"
      - "8777:8777"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true